const $=(s,el=document)=>el.querySelector(s), $$=(s,el=document)=>[...el.querySelectorAll(s)];

function lima(d){ return new Date(new Date(d).getTime()-5*3600e3); }
function fmtFecha(iso){ if(!iso) return ""; const t=lima(iso); if(isNaN(t)) return iso; return `${p2(t.getUTCDate())}/${p2(t.getUTCMonth()+1)}/${t.getUTCFullYear()} ${p2(t.getUTCHours())}:${p2(t.getUTCMinutes())}:${p2(t.getUTCSeconds())}`; }

function canon(o){ if(Array.isArray(o)) return "["+o.map(canon).join(",")+"]"; if(o&&typeof o==="object") return "{"+Object.keys(o).sort().map(k=>JSON.stringify(k)+":"+canon(o[k])).join(",")+"}"; return JSON.stringify(o); }
async function sha256(txt){ const h=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(txt)); return [...new Uint8Array(h)].map(b=>b.toString(16).padStart(2,"0")).join(""); }

/* ---------- acceso ---------- */
let S=LS.get("sesion"), YO=null, DEMO=false;
async function guardarSesion(j){ S={access_token:j.access_token,refresh_token:j.refresh_token,expires_at:j.expires_at||Math.floor(Date.now()/1000)+(j.expires_in||3600),uid:(j.user&&j.user.id)||(S||{}).uid,email:(j.user&&j.user.email)||(S||{}).email}; LS.set("sesion",S); return S; }

async function api(ruta,opt={}){ if(!S) throw new Error("Sin sesión"); if(Date.now()/1000>(S.expires_at||0)-60) await refrescar();
  const h=Object.assign({},opt.headers||{},{apikey:CENTRAL.clave,Authorization:"Bearer "+S.access_token}); let r=await fetch(CENTRAL.url+ruta,{...opt,headers:h});
  if(r.status===401){ await refrescar(); h.Authorization="Bearer "+S.access_token; r=await fetch(CENTRAL.url+ruta,{...opt,headers:h}); } return r; }
async function errTxt(r){ const t=await r.text().catch(()=>""); try{ const j=JSON.parse(t); return j.message||j.error||j.msg||t; }catch(e){ return t||("HTTP "+r.status); } }

  const j=await r.json().catch(()=>({})); if(!r.ok) throw new Error(j.error_description||j.msg||"Correo o contraseña incorrectos"); await guardarSesion(j); }

/* ---------- datos y filtros ---------- */
let D={proy:[],vis:[],perf:[],asig:[]}; let F={dep:"",sector:"",sup:"",sem:"",dia:"",proy:"",desde:"",hasta:""}; let VISTA="tablero", MAPA=null, CAPA=null;
const SEM_ORD=["Crítico","Con observaciones","Conforme","Borrador"]; const SEM_CL={"Conforme":"ok","Con observaciones":"warn","Crítico":"bad","Borrador":"none"};
function preparar(){ const P=new Map(D.proy.map(p=>[p.uuid,p]));
  for(const v of D.vis){ const p=P.get(v.proyecto_uuid)||{}; v._p=p; v._dep=p.departamento||"(sin dato)"; v._sec=p.sector||"(sin dato)"; v._dia=diaISO(v.fecha_creacion);

  $("#fCsv").onclick=exportarVisitas;

/* ================= TABLERO ================= */
function vTablero(){
  if(!$("#tb")){ $("#app").innerHTML=`<div class="grid" id="tb">
    <div class="grid s12" id="kpis" style="grid-template-columns:repeat(12,1fr)"></div>

    const r=await api(`/rest/v1/visitas?uuid=eq.${v.uuid}`,{method:"PATCH",headers:{"Content-Type":"application/json",Prefer:"return=minimal"},body:JSON.stringify(body)});
    if(!r.ok) return toast("✖ "+await errTxt(r),5000);
    await api("/rest/v1/bitacora",{method:"POST",headers:{"Content-Type":"application/json",Prefer:"return=minimal"},body:JSON.stringify({id:crypto.randomUUID(),ts:isoLima(),usuario:YO.nombre,dispositivo:"CENTRO-MANDO",accion:"REABRIR",entidad:"visita",ref:v.uuid,detalle:motivo})});
    toast("Visita reabierta ✔"); d.close(); await cargar(); }); }

/* ================= USUARIOS Y ASIGNACIONES ================= */
async function vUsuarios(){ if(DEMO){ $("#app").innerHTML=`<div class="card"><h2>Usuarios y asignaciones</h2><p class="muted">No disponible en modo demostración. Ingrese con su cuenta de gerente para administrar usuarios.</p></div>`; return; }
  const esG=YO.rol==="gerente"; const pf=D.perf.slice().sort((a,b)=>(a.activo===b.activo?0:a.activo?1:-1)||(a.nombre||a.correo||"").localeCompare(b.nombre||b.correo||""));
  const supers=D.perf.filter(x=>x.activo&&["supervisor","coordinador"].includes(x.rol));
  $("#app").innerHTML=`<div class="card"><h2>Usuarios (${pf.length})</h2><p class="msg">${pf.filter(x=>!x.activo).length?`<b class="neg">${pf.filter(x=>!x.activo).length} cuenta(s) esperan activación.</b> `:""}Las cuentas se crean en Supabase (Authentication → Users → Add user, marcando Auto Confirm). Aquí se activan, se les da rol y región.</p>
   <div class="scroll"><table class="t"><thead><tr><th>Correo</th><th>Nombres y apellidos</th><th>Cargo</th><th>Rol</th><th>Región (coordinador)</th><th>Activa</th><th></th></tr></thead><tbody>
   ${pf.map(u=>`<tr data-id="${u.id}"><td>${esc(u.correo)}</td><td><input class="ed uN" value="${esc(u.nombre)}" ${esG?"":"disabled"}></td><td><input class="ed uC" value="${esc(u.cargo)}" ${esG?"":"disabled"}></td>
     <td><select class="ed uR" ${esG&&u.id!==YO.id?"":"disabled"}>${["supervisor","coordinador","gerente","auditor"].map(r=>`<option ${u.rol===r?"selected":""}>${r}</option>`).join("")}</select></td>
     <td><select class="ed uG" ${esG?"":"disabled"}><option value="">—</option>${DEPARTAMENTOS.map(d=>`<option ${u.region===d?"selected":""}>${d}</option>`).join("")}</select></td>
     <td><input type="checkbox" class="uA" ${u.activo?"checked":""} ${esG&&u.id!==YO.id?"":"disabled"} style="width:22px;height:22px"></td><td>${esG?'<button class="btn sec uOk">Guardar</button>':""}</td></tr>`).join("")}</tbody></table></div></div>
  <div class="card" style="margin-top:.8rem"><h2>Asignar proyectos a supervisores</h2><p class="msg">El supervisor verá el proyecto en su app la próxima vez que sincronice.</p>
   <div class="filtros" style="position:static;border:0;padding:0"><div><label for="aProy">Proyecto</label><select id="aProy" style="max-width:28rem">${D.proy.slice().sort((a,b)=>(a.cui||"").localeCompare(b.cui||"")).map(p=>`<option value="${p.uuid}">${esc(p.cui||"—")} · ${esc((p.nombre||"").slice(0,60))}</option>`).join("")}</select></div>
   <div><label for="aUsr">Supervisor</label><select id="aUsr">${supers.map(u=>`<option value="${u.id}">${esc(u.nombre||u.correo)} (${u.rol})</option>`).join("")}</select></div><div><button class="btn" id="aOk">Asignar</button></div></div>
   <div class="scroll" style="margin-top:.6rem"><table class="t"><thead><tr><th>Proyecto</th><th>Supervisor</th><th>Desde</th><th>Estado</th><th></th></tr></thead><tbody>
   ${D.asig.slice().sort((a,b)=>b.fecha.localeCompare(a.fecha)).map(a=>{ const p=D.proy.find(x=>x.uuid===a.proyecto_uuid)||{}; const u=D.perf.find(x=>x.id===a.usuario_id)||{}; return `<tr><td>${esc(p.cui||"")} · ${esc((p.nombre||"").slice(0,50))}</td><td>${esc(u.nombre||u.correo||"")}</td><td>${fmtDia(a.fecha)}</td><td>${a.activa?'<span class="pill s-ok">Activa</span>':'<span class="pill s-none">Retirada</span>'}</td><td>${a.activa?`<button class="btn ghost aQ" data-id="${a.id}">Retirar</button>`:`<button class="btn ghost aR" data-id="${a.id}">Reactivar</button>`}</td></tr>`; }).join("")||'<tr><td colspan="5" class="muted">Sin asignaciones todavía.</td></tr>'}</tbody></table></div></div>`;
  $$("#app .uOk").forEach(b=>b.onclick=async()=>{ const tr=b.closest("tr"); const body={nombre:$(".uN",tr).value.trim(),cargo:$(".uC",tr).value.trim(),rol:$(".uR",tr).value,region:$(".uG",tr).value,activo:$(".uA",tr).checked};
    const r=await api(`/rest/v1/perfiles?id=eq.${tr.dataset.id}`,{method:"PATCH",headers:{"Content-Type":"application/json",Prefer:"return=minimal"},body:JSON.stringify(body)});
    if(!r.ok) return toast("✖ "+await errTxt(r),5000); await bit("EDITAR","usuario",tr.dataset.id,`${body.nombre} · ${body.rol} · ${body.activo?"activa":"inactiva"} · ${body.region||"-"}`); toast("Usuario guardado ✔"); await cargar(); });
  $("#aOk")&&($("#aOk").onclick=async()=>{ const pu=$("#aProy").value, us=$("#aUsr").value; if(!pu||!us) return toast("Elija proyecto y supervisor");
    const r=await api("/rest/v1/asignaciones?on_conflict=proyecto_uuid,usuario_id",{method:"POST",headers:{"Content-Type":"application/json",Prefer:"resolution=merge-duplicates,return=minimal"},body:JSON.stringify({proyecto_uuid:pu,usuario_id:us,activa:true})});
    if(!r.ok) return toast("✖ "+await errTxt(r),5000); await bit("ASIGNAR","proyecto",pu,"a "+us); toast("Proyecto asignado ✔"); await cargar(); });
  const cambiarA=async(id,activa)=>{ const r=await api(`/rest/v1/asignaciones?id=eq.${id}`,{method:"PATCH",headers:{"Content-Type":"application/json",Prefer:"return=minimal"},body:JSON.stringify({activa})}); if(!r.ok) return toast("✖ "+await errTxt(r),5000); await bit(activa?"REACTIVAR":"RETIRAR","asignacion",id,""); await cargar(); };
  $$("#app .aQ").forEach(b=>b.onclick=()=>cambiarA(b.dataset.id,false)); $$("#app .aR").forEach(b=>b.onclick=()=>cambiarA(b.dataset.id,true)); }
async function bit(accion,entidad,ref,detalle){ try{ await api("/rest/v1/bitacora",{method:"POST",headers:{"Content-Type":"application/json",Prefer:"return=minimal"},body:JSON.stringify({id:crypto.randomUUID(),ts:isoLima(),usuario:YO.nombre,dispositivo:"CENTRO-MANDO",accion,entidad,ref,detalle})}); }catch(e){} }

/* ================= BITÁCORA ================= */
async function vBitacora(){ if(DEMO){ $("#app").innerHTML=`<div class="card"><h2>Bitácora</h2><p class="muted">No disponible en modo demostración.</p></div>`; return; }
  $("#app").innerHTML=`<div class="card"><p class="muted">Cargando…</p></div>`; const r=await api("/rest/v1/bitacora?select=*&order=ts.desc&limit=500"); if(!r.ok){ $("#app").innerHTML=`<div class="card neg">✖ ${esc(await errTxt(r))}</div>`; return; } const b=await r.json();
  $("#app").innerHTML=`<div class="card"><h2>Bitácora · últimos ${b.length} eventos</h2><p class="msg">Registro inalterable: nadie puede modificarlo ni borrarlo.</p><p class="noprint"><button class="btn sec" id="bCsv">Exportar a Excel</button></p>
   <div class="scroll"><table class="t"><thead><tr><th>Fecha y hora</th><th>Usuario</th><th>Equipo</th><th>Acción</th><th>Objeto</th><th>Detalle</th></tr></thead><tbody>${b.map(x=>`<tr><td>${fmtFecha(x.ts)}</td><td>${esc(x.usuario)}</td><td>${esc(x.dispositivo)}</td><td>${esc(x.accion)}</td><td>${esc(x.entidad)}</td><td>${esc(x.detalle)}</td></tr>`).join("")}</tbody></table></div></div>`;
  $("#bCsv").onclick=()=>csv(`SUPERVISA_bitacora_${stamp()}.csv`,[["Fecha","Usuario","Equipo","Accion","Objeto","Referencia","Detalle","Recibido"],...b.map(x=>[fmtFecha(x.ts),x.usuario,x.dispositivo,x.accion,x.entidad,x.ref,x.detalle,fmtFecha(x.recibido_en)])]); }

/* ================= CARGA ================= */
async function cargar(){ if(DEMO){ preparar(); pintarFiltros(); render(); return; }
  $("#quien").textContent="Cargando datos…";
  try{ YO=await perfil(); if(!YO||!YO.activo) throw new Error("Su cuenta no está activa."); if(YO.rol==="supervisor") throw new Error("El centro de mando es para gerente, coordinador o auditor. Use la app de campo.");
    const [proy,vis,perf,asig]=await Promise.all([getAll("proyectos","select=*&estado_registro=eq.ACTIVO"),getAll("visitas","select=uuid,proyecto_uuid,numero,estado,fecha_creacion,fecha_cierre,supervisor,usuario_id,lat,lon,avance_fisico,avance_programado,resultado,hash&estado_registro=eq.ACTIVO"),getAll("perfiles","select=*"),getAll("asignaciones","select=*")]);
    D={proy,vis,perf,asig}; preparar();
    $("#quien").textContent=`${YO.nombre||YO.correo} · ${YO.rol}${YO.region?" · "+YO.region:""} · actualizado ${fmtFecha(isoLima())}`;
    $("#tabs").classList.remove("hide"); $("#filtros").classList.remove("hide"); pintarFiltros(); render();
  }catch(e){ $("#quien").textContent="Gerencia de supervisión de proyectos"; pantallaIngreso(e.message); } }
$("#bRec").onclick=()=>cargar();

/* ================= INGRESO ================= */
function pantallaIngreso(msg=""){ $("#tabs").classList.add("hide"); $("#filtros").classList.add("hide"); $("#chips").innerHTML="";
  $("#app").innerHTML=`<div class="card" style="max-width:520px;margin:2rem auto"><h2>Ingresar al centro de mando</h2><p class="msg">Para gerente, coordinador regional o auditor. Use su correo y contraseña de SUPERVISA·PE.</p>
   <label class="muted" for="lE">Correo</label><input id="lE" class="ed" style="max-width:none;width:100%;min-height:44px" inputmode="email" autocomplete="username" value="${esc(LS.get("correo")||"")}">
   <label class="muted" for="lP">Contraseña</label><input id="lP" class="ed" style="max-width:none;width:100%;min-height:44px" type="password" autocomplete="current-password">
   <p style="display:flex;gap:.5rem;flex-wrap:wrap;margin-top:.8rem"><button class="btn" id="lOk">Ingresar</button><button class="btn ghost" id="lDemo">Ver demostración (datos ficticios)</button></p>
   <p id="lMsg" class="${msg?"neg":"muted"}">${esc(msg)}</p></div>`;
  $("#lOk").onclick=async()=>{ const e=$("#lE").value.trim().toLowerCase(), p=$("#lP").value; if(!e||!p) return toast("Escriba correo y contraseña"); LS.set("correo",e); $("#lMsg").textContent="Verificando…";
    try{ await ingresar(e,p); $("#lP").value=""; await cargar(); }catch(er){ $("#lMsg").className="neg"; $("#lMsg").textContent="✖ "+er.message; } };
  $("#lP").onkeydown=ev=>{ if(ev.key==="Enter") $("#lOk").click(); }; $("#lDemo").onclick=iniciarDemo; }

/* ================= DEMOSTRACIÓN (datos ficticios, solo en pantalla) ================= */
function iniciarDemo(){ DEMO=true; $("#demoAviso").classList.remove("hide"); YO={nombre:"Gerente (demostración)",rol:"gerente"}; let s=20261111; const rnd=()=>((s=(s*1103515245+12345)%2147483648)/2147483648);
  const deps=[["LA LIBERTAD",-8.11,-79.03],["LIMA",-12.05,-77.04],["PIURA",-5.19,-80.63],["CUSCO",-13.53,-71.97],["AREQUIPA",-16.41,-71.54],["LAMBAYEQUE",-6.77,-79.84],["CAJAMARCA",-7.16,-78.51],["JUNIN",-12.07,-75.21]];
  const secs=["SANEAMIENTO","EDUCACION","SALUD","TRANSPORTE","AGRARIO","ENERGIA","VIVIENDA Y DESARROLLO URBANO"]; const tipos={SANEAMIENTO:"Agua potable y alcantarillado",EDUCACION:"Institución educativa",SALUD:"Centro de salud",TRANSPORTE:"Camino vecinal",AGRARIO:"Canal de riego",ENERGIA:"Electrificación rural","VIVIENDA Y DESARROLLO URBANO":"Pistas y veredas"};
  const sups=["Ana Quispe (DEMO)","Luis Ramos (DEMO)","Rosa Huamán (DEMO)","Jorge Flores (DEMO)","Carla Vega (DEMO)","Pedro Torres (DEMO)"];
  D={proy:[],vis:[],perf:[],asig:[]}; const hoy=Date.now();
  for(let i=0;i<42;i++){ const d=deps[Math.floor(rnd()*deps.length)], sc=secs[Math.floor(rnd()*secs.length)]; const u="demo-p-"+i;
    D.proy.push({uuid:u,cui:String(2400000+Math.floor(rnd()*99999)),nombre:`DEMO · Mejoramiento de ${tipos[sc].toLowerCase()} N.° ${i+1} · ${d[0]}`,entidad:"Entidad ficticia",sector:sc,departamento:d[0],provincia:"—",distrito:"—",lat:+(d[1]+(rnd()-.5)*.9).toFixed(6),lon:+(d[2]+(rnd()-.5)*.9).toFixed(6),capas_geoperu:"43431",enlaces:[]});
    const nv=1+Math.floor(rnd()*4); let pl=10+rnd()*30, ac=pl+(rnd()-.6)*20;
    for(let k=0;k<nv;k++){ const dias=Math.floor(rnd()*80); const f=new Date(hoy-dias*864e5-rnd()*8*36e5).toISOString(); pl=Math.min(100,pl+3+rnd()*9); ac=Math.max(0,Math.min(100,pl+(rnd()-.42)*16));
      const pct=Math.round((55+rnd()*45)*10)/10; const crit=rnd()<.18?["NUC-C02"]:[]; const sem=crit.length||pct<60?"Crítico":pct<85?"Con observaciones":"Conforme"; const cerr=rnd()<.88;
      D.vis.push({uuid:`demo-v-${i}-${k}`,proyecto_uuid:u,numero:k+1,estado:cerr?"CERRADA":"BORRADOR",fecha_creacion:f,fecha_cierre:cerr?f:null,supervisor:sups[Math.floor(rnd()*sups.length)],lat:null,lon:null,avance_fisico:Math.round(ac),avance_programado:Math.round(pl),resultado:cerr?{pct,semaforo:sem,criticos:crit}:null,respuestas:crit.length?{"NUC-C02":{v:"NO",obs:"Sin registro de pruebas de calidad (ejemplo)"}}:{},hash:"",reabierta:[]}); } }
  $("#quien").textContent="Demostración · datos ficticios"; $("#tabs").classList.remove("hide"); $("#filtros").classList.remove("hide"); preparar(); pintarFiltros(); ir("tablero"); }

/* ---------- arranque ---------- */
apariencia(); red(); $$("#tabs button").forEach(b=>b.setAttribute("aria-current",b.dataset.v==="tablero"?"page":"false"));
if(S) cargar(); else pantallaIngreso();
</script>
