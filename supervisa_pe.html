<style>
/* ===== Paleta cálida (modo claro por defecto) ===== */
:root{
  --bg:#F3EEE6; --surface:#FFFFFF; --surface2:#EAE3D7; --text:#3A332C; --muted:#5E554B;
  --primary:#A8401A; --primary-ink:#FFFFFF; --accent:#0059F1; --border:#D8CFC2;
  --ok:#5B6B2E; --warn:#9A5B00; --bad:#B3261E; --ok-bg:#E9EEDB; --warn-bg:#FFF1D6; --bad-bg:#FBE3E1;
  --focus:#0059F1; --fs:18px; --radius:12px; --shadow:0 1px 3px rgba(60,30,10,.12);
}
:root[data-theme="oscuro"]{
  --bg:#23201C; --surface:#2E2A25; --surface2:#3A352E; --text:#F1EBE2; --muted:#CFC4B5;
  --primary:#E8875A; --primary-ink:#23201C; --accent:#6FA0FF; --border:#5A5248;
  --ok:#A8B86B; --warn:#F2C062; --bad:#FF8A80; --ok-bg:#2C3318; --warn-bg:#3D2E10; --bad-bg:#3F1C1A;
  --focus:#6FA0FF; --shadow:0 1px 3px rgba(0,0,0,.5);
}
:root[data-theme="sol"]{ /* máximo contraste para pleno sol */
  --bg:#FFFFFF; --surface:#FFFFFF; --surface2:#FFF4E0; --text:#000000; --muted:#2B1D14;
  --primary:#7A2600; --primary-ink:#FFFFFF; --accent:#0040B0; --border:#000000;
  --ok:#3E4A1E; --warn:#6B3D00; --bad:#8E0B03; --ok-bg:#DDF3DD; --warn-bg:#FFE9B8; --bad-bg:#FFD6D2;
  --focus:#0033CC; --shadow:none;
}
*{box-sizing:border-box}
html{font-size:var(--fs)}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Segoe UI",Roboto,Arial,sans-serif;line-height:1.45;-webkit-text-size-adjust:100%}
:root[data-theme="sol"] body{font-weight:500}
a{color:var(--primary)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
header.top{position:sticky;top:0;z-index:20;background:var(--primary);color:var(--primary-ink);padding:.5rem .8rem;display:flex;align-items:center;gap:.5rem;flex-wrap:wrap}
header.top h1{font-size:1.1rem;margin:0;flex:1;min-width:10rem;letter-spacing:.02em}
header.top small{display:block;font-weight:400;opacity:.9;font-size:.72rem}
.tbtn{background:transparent;border:2px solid currentColor;color:inherit;border-radius:10px;min-height:44px;min-width:44px;padding:0 .6rem;cursor:pointer;font-weight:700}
nav.tabs{display:flex;gap:.3rem;overflow-x:auto;background:var(--surface2);padding:.4rem .5rem;border-bottom:1px solid var(--border)}
nav.tabs button{flex:0 0 auto;border:1px solid var(--border);background:var(--surface);border-radius:999px;padding:.45rem .9rem;min-height:44px;cursor:pointer;font-weight:600}
nav.tabs button[aria-current="page"]{background:var(--primary);color:var(--primary-ink);border-color:var(--primary)}
main{max-width:980px;margin:0 auto;padding:.8rem .8rem 6rem}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:.9rem;margin:.7rem 0;box-shadow:var(--shadow)}
.card h2,.card h3{margin:.1rem 0 .5rem;font-size:1.05rem}
.row{display:flex;gap:.6rem;flex-wrap:wrap;align-items:center}
.grow{flex:1 1 14rem}
label.f{display:block;font-weight:600;margin:.55rem 0 .2rem;font-size:.9rem}
input[type=text],input[type=number],input[type=search],input[type=password],input[type=url],select,textarea{width:100%;padding:.6rem .7rem;border:1.5px solid var(--border);border-radius:10px;background:var(--surface);min-height:46px}
textarea{min-height:5rem;resize:vertical}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.4rem;min-height:48px;padding:.5rem 1rem;border-radius:10px;border:1.5px solid var(--primary);background:var(--primary);color:var(--primary-ink);font-weight:700;cursor:pointer;text-decoration:none}
.btn.sec{background:var(--surface);color:var(--primary)}
.btn.ghost{background:transparent;border-color:var(--border);color:var(--text)}
.btn.danger{background:var(--bad);border-color:var(--bad);color:#fff}
.btn:disabled{opacity:.5;cursor:not-allowed}
.muted{color:var(--muted);font-size:.88rem}
.pill{display:inline-block;padding:.15rem .6rem;border-radius:999px;font-size:.8rem;font-weight:700;border:1px solid transparent}
.s-ok{background:var(--ok-bg);color:var(--ok);border-color:var(--ok)}
.s-warn{background:var(--warn-bg);color:var(--warn);border-color:var(--warn)}
.s-bad{background:var(--bad-bg);color:var(--bad);border-color:var(--bad)}
.s-none{background:var(--surface2);color:var(--muted);border-color:var(--border)}
.proj{cursor:pointer}
.proj:hover{border-color:var(--primary)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(9rem,1fr));gap:.6rem}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:.6rem .8rem;cursor:pointer}
.kpi b{display:block;font-size:1.5rem}
.kpi[aria-pressed="true"]{outline:3px solid var(--primary)}
details.sec{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);margin:.6rem 0}
details.sec>summary{cursor:pointer;padding:.8rem;font-weight:700;list-style:none;display:flex;justify-content:space-between;gap:.5rem}
details.sec>summary::-webkit-details-marker{display:none}
.q{border-top:1px solid var(--border);padding:.75rem .8rem}
.q .t{font-weight:600}
.q .meta{font-size:.78rem;color:var(--muted)}
.ans{display:flex;gap:.4rem;margin:.5rem 0;flex-wrap:wrap}
.ans button{flex:1 1 5.5rem;min-height:52px;border-radius:10px;border:2px solid var(--border);background:var(--surface);font-weight:800;cursor:pointer}
.ans button[aria-pressed="true"].si{background:var(--ok);border-color:var(--ok);color:#fff}
.ans button[aria-pressed="true"].no{background:var(--bad);border-color:var(--bad);color:#fff}
.ans button[aria-pressed="true"].na{background:var(--muted);border-color:var(--muted);color:var(--bg)}
.thumbs{display:flex;gap:.4rem;flex-wrap:wrap;margin-top:.4rem}
.thumbs img{width:84px;height:84px;object-fit:cover;border-radius:8px;border:1px solid var(--border)}
.bar{height:12px;background:var(--surface2);border-radius:999px;overflow:hidden;border:1px solid var(--border)}
.bar>i{display:block;height:100%;background:var(--primary)}
.sticky-foot{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:2px solid var(--border);padding:.5rem .8rem calc(.5rem + env(safe-area-inset-bottom));display:flex;gap:.5rem;justify-content:center;flex-wrap:wrap;z-index:15}
table.t{width:100%;border-collapse:collapse;font-size:.85rem}
table.t th,table.t td{border-bottom:1px solid var(--border);padding:.4rem;text-align:left;vertical-align:top}
table.t th{background:var(--surface2)}
.scroll{overflow-x:auto}
.toast{position:fixed;left:50%;bottom:5.5rem;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:.7rem 1rem;border-radius:10px;z-index:50;max-width:90vw;font-weight:600}
dialog{border:2px solid var(--border);border-radius:var(--radius);background:var(--surface);color:var(--text);max-width:min(560px,94vw);width:100%}
dialog::backdrop{background:rgba(0,0,0,.45)}
#mapa{height:360px;border-radius:var(--radius);border:1px solid var(--border)}
.hide{display:none!important}
.lock{border-left:6px solid var(--ok)}
.draft{border-left:6px solid var(--accent)}
#print{display:none}
.mb{background:#0059F1;color:#FFFFFF;text-align:center;font-weight:800;padding:.35rem;letter-spacing:.03em}
@media print{
  body *{visibility:hidden} #print,#print *{visibility:visible}
  #print{display:block;position:absolute;left:0;top:0;width:100%;color:#000;background:#fff;font-size:11pt}
  #print table{width:100%;border-collapse:collapse} #print td,#print th{border:1px solid #999;padding:3px 5px;font-size:9.5pt;vertical-align:top}
  #print img{width:150px;height:110px;object-fit:cover;margin:2px}
  #print h1{font-size:15pt;margin:0 0 4px} #print h2{font-size:12pt;margin:10px 0 4px;background:#F4EADB;padding:3px}
}

<script>
"use strict";
/* =====================================================================
   SUPERVISA·PE  v0.4.0  ·  Archivo único, sin servidor, costo cero
   Datos: IndexedDB del navegador (en el equipo). Sincronía: paquetes .json
   Fecha/hora: UTC-5 (Lima)  ·  Coordenadas: WGS84, 6 decimales
   ===================================================================== */
const APP = { nombre:"SUPERVISA·PE", version:"0.4.0", esquema:1 };

/* ---------- utilidades ---------- */
const $ = (s,el=document)=>el.querySelector(s);
const $$ = (s,el=document)=>[...el.querySelectorAll(s)];
const esc = s => String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const p2 = n => String(n).padStart(2,"0");
function isoLima(d=new Date()){ const t=new Date(d.getTime()-5*3600e3); return t.toISOString().replace("Z","-05:00"); }
function fmtFecha(iso){ if(!iso) return ""; const d=new Date(iso); if(isNaN(d)) return iso; const t=new Date(d.getTime()-5*3600e3);
  return `${p2(t.getUTCDate())}/${p2(t.getUTCMonth()+1)}/${t.getUTCFullYear()} ${p2(t.getUTCHours())}:${p2(t.getUTCMinutes())}:${p2(t.getUTCSeconds())}`; }
function fmtDia(iso){ return fmtFecha(iso).slice(0,10); }
function stamp(){ const t=new Date(Date.now()-5*3600e3); return `${t.getUTCFullYear()}${p2(t.getUTCMonth()+1)}${p2(t.getUTCDate())}_${p2(t.getUTCHours())}${p2(t.getUTCMinutes())}${p2(t.getUTCSeconds())}`; }
function uuid(){ if(crypto.randomUUID) return crypto.randomUUID(); const b=crypto.getRandomValues(new Uint8Array(16)); b[6]=(b[6]&15)|64; b[8]=(b[8]&63)|128; const h=[...b].map(x=>x.toString(16).padStart(2,"0")).join(""); return `${h.slice(0,8)}-${h.slice(8,12)}-${h.slice(12,16)}-${h.slice(16,20)}-${h.slice(20)}`; }
const c6 = v => (v===null||v===undefined||v==="")?"":Number(v).toFixed(6);
function toast(m,ms=2600){ const d=document.createElement("div"); d.className="toast"; d.textContent=m; document.body.appendChild(d); setTimeout(()=>d.remove(),ms); }
function descargar(nombre, contenido, tipo="application/json"){ const b=contenido instanceof Blob?contenido:new Blob([contenido],{type:tipo}); const a=document.createElement("a"); a.href=URL.createObjectURL(b); a.download=nombre; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1500); }
function leerArchivo(file){ return new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.onerror=()=>rej(r.error); r.readAsText(file,"utf-8"); }); }
function elegirArchivo(accept){ return new Promise(res=>{ const i=document.createElement("input"); i.type="file"; i.accept=accept; i.onchange=()=>res(i.files[0]||null); i.click(); }); }

/* ---------- SHA-256 (nativo o respaldo en JS) ---------- */
async function sha256(txt){
  const data=new TextEncoder().encode(txt);
  if(window.crypto && crypto.subtle){ try{ const h=await crypto.subtle.digest("SHA-256",data); return [...new Uint8Array(h)].map(b=>b.toString(16).padStart(2,"0")).join(""); }catch(e){} }
  return sha256js(data);
}
function sha256js(bytes){
  const K=[0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2];
  let H=[0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19];
  const l=bytes.length, n=((l+9+63)>>6)<<6, m=new Uint8Array(n); m.set(bytes); m[l]=0x80;
  const bits=l*8; const dv=new DataView(m.buffer); dv.setUint32(n-4,bits>>>0); dv.setUint32(n-8,Math.floor(bits/4294967296));
  const W=new Uint32Array(64); const r=(x,y)=>(x>>>y)|(x<<(32-y));
  for(let i=0;i<n;i+=64){ for(let t=0;t<16;t++) W[t]=dv.getUint32(i+t*4);
    for(let t=16;t<64;t++){ const s0=r(W[t-15],7)^r(W[t-15],18)^(W[t-15]>>>3), s1=r(W[t-2],17)^r(W[t-2],19)^(W[t-2]>>>10); W[t]=(W[t-16]+s0+W[t-7]+s1)>>>0; }
    let [a,b,c,d,e,f,g,h]=H;
    for(let t=0;t<64;t++){ const S1=r(e,6)^r(e,11)^r(e,25), ch=(e&f)^(~e&g), t1=(h+S1+ch+K[t]+W[t])>>>0, S0=r(a,2)^r(a,13)^r(a,22), mj=(a&b)^(a&c)^(b&c), t2=(S0+mj)>>>0;
      h=g; g=f; f=e; e=(d+t1)>>>0; d=c; c=b; b=a; a=(t1+t2)>>>0; }
    H=[H[0]+a,H[1]+b,H[2]+c,H[3]+d,H[4]+e,H[5]+f,H[6]+g,H[7]+h].map(x=>x>>>0); }
  return H.map(x=>x.toString(16).padStart(8,"0")).join("");
}
function canon(o){ if(Array.isArray(o)) return "["+o.map(canon).join(",")+"]"; if(o&&typeof o==="object") return "{"+Object.keys(o).sort().map(k=>JSON.stringify(k)+":"+canon(o[k])).join(",")+"}"; return JSON.stringify(o); }

/* ---------- Base de datos local (IndexedDB) ---------- */
const STORES={proyectos:"uuid",visitas:"uuid",fotos:"uuid",plantillas:"id",bitacora:"id",config:"k",ordenes:"uuid",tareas:"uuid",partes:"uuid",incidencias:"uuid",equipos:"id"};
const DB={ db:null, mem:null,
  open(){ return new Promise(res=>{ try{ const r=indexedDB.open(AMBIENTE==="pruebas"?"supervisa_pe_pruebas":"supervisa_pe",2);
      r.onupgradeneeded=()=>{ const db=r.result; for(const [s,k] of Object.entries(STORES)) if(!db.objectStoreNames.contains(s)) db.createObjectStore(s,{keyPath:k}); };
      r.onsuccess=()=>{ DB.db=r.result; res(true); };
      r.onerror=()=>{ DB.mem={}; for(const s in STORES) DB.mem[s]=new Map(); res(false); };
    }catch(e){ DB.mem={}; for(const s in STORES) DB.mem[s]=new Map(); res(false); } }); },
  _st(s,m){ return DB.db.transaction(s,m).objectStore(s); },
  all(s){ if(DB.mem) return Promise.resolve([...DB.mem[s].values()]); return new Promise((res,rej)=>{ const q=DB._st(s,"readonly").getAll(); q.onsuccess=()=>res(q.result); q.onerror=()=>rej(q.error); }); },
  get(s,k){ if(DB.mem) return Promise.resolve(DB.mem[s].get(k)); return new Promise((res,rej)=>{ const q=DB._st(s,"readonly").get(k); q.onsuccess=()=>res(q.result); q.onerror=()=>rej(q.error); }); },
  put(s,v){ if(DB.mem){ DB.mem[s].set(v[STORES[s]],v); return Promise.resolve(); } return new Promise((res,rej)=>{ const q=DB._st(s,"readwrite").put(v); q.onsuccess=()=>res(); q.onerror=()=>rej(q.error); }); }
};
let CFG={};
async function cfgGet(){ const all=await DB.all("config"); CFG={}; all.forEach(r=>CFG[r.k]=r.v); }
async function cfgSet(k,v){ CFG[k]=v; await DB.put("config",{k,v}); }
async function log(accion,entidad,id,detalle=""){ await DB.put("bitacora",{id:uuid(),ts:isoLima(),usuario:CFG.usuario||"",dispositivo:CFG.dispositivo||"",accion,entidad,ref:id||"",detalle}); }
function audNuevo(origen="captura_app"){ const t=isoLima(); return {creado_por:CFG.usuario||"",fecha_creacion:t,modificado_por:CFG.usuario||"",fecha_modificacion:t,estado_registro:"ACTIVO",sincronizado:false,origen_captura:origen,dispositivo:CFG.dispositivo||""}; }
function audMod(o){ o.modificado_por=CFG.usuario||""; o.fecha_modificacion=isoLima(); o.sincronizado=false; if(typeof sincronizarPronto==="function") sincronizarPronto(); return o; }

/* ---------- Plantillas base (homologadas: NÚCLEO + módulo por sector) ---------- */
const q=(cod,texto,peso=2,critica=false,ayuda="")=>({cod,texto,tipo:"sino",peso,critica,ayuda});
const PLANTILLAS_BASE=[
 {id:"NUCLEO",nombre:"Núcleo común de supervisión de obra",version:"1.0",tipo:"nucleo",palabras:[],secciones:[
  {titulo:"A. Documentación y gestión en obra",preguntas:[
   q("NUC-A01","¿El cartel de obra está instalado y visible, con CUI, monto y plazo?",2),
   q("NUC-A02","¿El cuaderno de obra está en obra y con anotaciones al día?",3,true),
   q("NUC-A03","¿El expediente técnico aprobado está disponible en obra?",2),
   q("NUC-A04","¿El residente de obra está presente durante la visita?",3,true),
   q("NUC-A05","¿El supervisor o inspector de la entidad está designado e identificado?",2),
   q("NUC-A06","¿El calendario de avance de obra vigente está disponible?",1)]},
  {titulo:"B. Plazo y avance",preguntas:[
   q("NUC-B01","¿La obra está en ejecución (no paralizada) al momento de la visita?",3,true),
   q("NUC-B02","¿El avance físico observado es coherente con el avance programado?",3),
   q("NUC-B03","¿Hay frentes de trabajo activos con personal y equipos acordes al calendario?",2),
   q("NUC-B04","¿Las ampliaciones de plazo o adicionales (si existen) están registrados y sustentados?",1,false,"Marque N.A. si no hay ampliaciones ni adicionales.")]},
  {titulo:"C. Calidad",preguntas:[
   q("NUC-C01","¿Los materiales en obra cuentan con certificados de calidad?",2),
   q("NUC-C02","¿Se realizan y registran pruebas de control de calidad (concreto, compactación, etc.)?",3,true),
   q("NUC-C03","¿Los trabajos ejecutados coinciden con planos y especificaciones técnicas?",3,true),
   q("NUC-C04","¿Los trabajos ejecutados están libres de defectos visibles (fisuras, asentamientos, filtraciones)?",2)]},
  {titulo:"D. Seguridad y salud en el trabajo",preguntas:[
   q("NUC-D01","¿El personal usa equipo de protección personal completo?",2),
   q("NUC-D02","¿La obra tiene cerco perimétrico y señalización de seguridad?",2),
   q("NUC-D03","¿Existe plan de seguridad y salud en el trabajo vigente en obra?",2),
   q("NUC-D04","¿Hay botiquín y procedimiento de respuesta a emergencias?",1)]},
  {titulo:"E. Ambiental y social",preguntas:[
   q("NUC-E01","¿Los residuos y el desmonte se manejan y disponen adecuadamente?",2),
   q("NUC-E02","¿Se aplican medidas para no afectar a vecinos, accesos y servicios (polvo, ruido, desvíos)?",1),

/* ---------- puntaje y semáforo ---------- */
function preguntasDe(plantIds){ const out=[]; for(const id of plantIds){ const p=PLANT_CACHE.find(x=>x.id===id); if(!p) continue; for(const s of p.secciones) for(const pr of s.preguntas) out.push({...pr,seccion:s.titulo,plantilla:p.id}); } return out; }
function calcular(v){ const prs=preguntasDe(v.plantillas||[]); let si=0,base=0,resp=0,crit=[];
  for(const pr of prs){ const r=(v.respuestas||{})[pr.cod]; if(!r||!r.v) continue; resp++; if(r.v==="NA") continue; base+=pr.peso; if(r.v==="SI") si+=pr.peso; if(r.v==="NO"&&pr.critica) crit.push(pr.cod); }
  const pct= base? Math.round(si*1000/base)/10 : null;
  let sem="s-none",txt="Sin datos"; if(pct!==null){ if(crit.length||pct<60){sem="s-bad";txt="Crítico";} else if(pct<85){sem="s-warn";txt="Con observaciones";} else {sem="s-ok";txt="Conforme";} }
  return {pct,resp,total:prs.length,crit,sem,txt}; }

async function buscarCeplan(cui){
  const tareas=CEPLAN_CAPAS.map(async c=>{ const u=`${CEPLAN_WFS}?service=WFS&version=2.0.0&request=GetFeature&typeNames=geoceplan:${c[1]}&count=1&outputFormat=application/json&CQL_FILTER=codigounic=${encodeURIComponent(cui)}`;
    try{ const r=await fetch(u); if(!r.ok) return null; const j=await r.json(); const f=j.features&&j.features[0]; return f?{capa:c,props:f.properties,geom:f.geometry?f.geometry.coordinates:[null,null]}:null; }catch(e){ return null; } });
  const res=await Promise.all(tareas); return res.find(Boolean)||null; }
function gps(ok){ if(!navigator.geolocation) return toast("Este equipo no tiene GPS disponible");
  toast("Obteniendo ubicación…",1500); navigator.geolocation.getCurrentPosition(p=>ok({lat:p.coords.latitude,lon:p.coords.longitude,acc:p.coords.accuracy}),e=>toast("No se pudo obtener GPS: "+e.message,4000),{enableHighAccuracy:true,timeout:20000,maximumAge:0}); }

  const s=document.createElement("script"); s.src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"; s.onload=res; s.onerror=rej; document.head.appendChild(s); }); }

  L.control.layers({"OpenStreetMap":osm},ov).addTo(m);
  if(p.lat) L.circleMarker([lat,lon],{radius:9,weight:3,color:"#A8401A",fillOpacity:.8}).addTo(m).bindPopup(esc(p.nombre));
  (vs||[]).filter(v=>v.lat).forEach(v=>L.circleMarker([v.lat,v.lon],{radius:7,weight:2,color:"#C98A12",fillOpacity:.2}).addTo(m).bindPopup("Visita N.° "+v.numero+" · "+fmtFecha(v.fecha_creacion)));

function vVisitaKeep(cod){ const y=scrollY; vVisita().then(()=>{ scrollTo(0,y); }); }
function tomarFoto(v,cod){ const i=document.createElement("input"); i.type="file"; i.accept="image/*"; i.capture="environment";
  i.onchange=async()=>{ const file=i.files[0]; if(!file) return; const data=await comprimir(file); const pos=await new Promise(r=>{ if(!navigator.geolocation) return r(null); navigator.geolocation.getCurrentPosition(p=>r(p.coords),()=>r(null),{enableHighAccuracy:true,timeout:8000,maximumAge:60000}); });
    const ft={uuid:uuid(),visita_uuid:v.uuid,pregunta:cod,data,fecha:isoLima(),lat:pos?Number(pos.latitude.toFixed(6)):"",lon:pos?Number(pos.longitude.toFixed(6)):"",hash:await sha256(data),...audNuevo()};
    await DB.put("fotos",ft); await log("FOTO","visita",v.uuid,cod||"general"); audMod(v); await DB.put("visitas",v); toast("Foto guardada ✔ ("+Math.round(data.length*0.75/1024)+" KB)"); vVisitaKeep(cod); };
  i.click(); }
function comprimir(file,max=1280,q=0.7){ return new Promise((res,rej)=>{ const img=new Image(); img.onload=()=>{ const k=Math.min(1,max/Math.max(img.width,img.height)); const cv=document.createElement("canvas"); cv.width=Math.round(img.width*k); cv.height=Math.round(img.height*k);
  const ctx=cv.getContext("2d"); ctx.drawImage(img,0,0,cv.width,cv.height); ctx.fillStyle="rgba(0,0,0,.55)"; ctx.fillRect(0,cv.height-26,cv.width,26); ctx.fillStyle="#fff"; ctx.font="16px sans-serif"; ctx.fillText(`${APP.nombre} · ${fmtFecha(isoLima())} · ${CFG.usuario||""}`,8,cv.height-8);
  URL.revokeObjectURL(img.src); res(cv.toDataURL("image/jpeg",q)); }; img.onerror=rej; img.src=URL.createObjectURL(file); }); }
async function cerrarVisita(v,fotos){
  const prs=preguntasDe(v.plantillas); const falt=prs.filter(x=>!(v.respuestas[x.cod]||{}).v);
  const sinEvid=prs.filter(x=>x.critica&&(v.respuestas[x.cod]||{}).v==="NO"&&(!(v.respuestas[x.cod].obs||"").trim()||!fotos.some(f=>f.pregunta===x.cod)));
  const err=[]; if(falt.length) err.push(`Faltan responder ${falt.length} pregunta(s): ${falt.slice(0,6).map(x=>x.cod).join(", ")}${falt.length>6?"…":""}`);
  if(sinEvid.length) err.push(`Preguntas críticas con “No” sin foto u observación: ${sinEvid.map(x=>x.cod).join(", ")}`);
  if(!v.lat) err.push("Falta registrar el GPS de la visita");
  if(err.length){ alert("No se puede cerrar todavía:\n\n• "+err.join("\n• ")); return; }
  if(!confirm("Al cerrar, la visita queda sellada (huella digital) y ya no se puede editar. ¿Cerrar?")) return;
  const c=calcular(v); v.resultado={pct:c.pct,semaforo:c.txt,criticos:c.crit}; v.estado="CERRADA"; v.fecha_cierre=isoLima();
  v.hash_prev=CFG.ultimo_hash||"GENESIS"; v.fotos_hash=fotos.map(f=>f.hash).sort();
  v.sellado=contenidoSellado(v); v.hash=await sha256(v.hash_prev+"|"+canon(v.sellado)); audMod(v); await DB.put("visitas",v); await cfgSet("ultimo_hash",v.hash);
  await log("CERRAR","visita",v.uuid,"hash "+v.hash.slice(0,16)); toast("Visita cerrada y sellada ✔"); vVisita(); }
function contenidoSellado(v){ return {uuid:v.uuid,proyecto_uuid:v.proyecto_uuid,cui:v.cui,numero:v.numero,plantillas:v.plantillas,versiones:v.versiones,supervisor:v.supervisor,lat:v.lat,lon:v.lon,respuestas:v.respuestas,avance_fisico:v.avance_fisico,avance_programado:v.avance_programado,observaciones:v.observaciones,recomendaciones:v.recomendaciones,fecha_creacion:v.fecha_creacion,fecha_cierre:v.fecha_cierre,fotos_hash:v.fotos_hash,resultado:v.resultado}; }

    <button class="btn ghost bDesc" data-id="${p.id}">Descargar para editar</button></div></details>`; }).join("")}`;
  $$(".bDesc").forEach(b=>b.onclick=()=>{ const p=PLANT_CACHE.find(x=>x.id===b.dataset.id); descargar(`plantilla_${p.id}_v${p.version}.json`,JSON.stringify(p,null,2)); });
  $("#bImpP").onclick=async()=>{ const f=await elegirArchivo(".json,application/json"); if(!f) return; try{ const p=JSON.parse(await leerArchivo(f)); validarPlantilla(p);

     p.importada=isoLima(); await DB.put("plantillas",p); await log("IMPORTAR","plantilla",p.id,"v"+p.version); await cargarPlantillas(); toast("Plantilla importada ✔"); vPlantillas(); }catch(e){ alert("Plantilla no válida:\n"+e.message); } };

function validarPlantilla(p){ if(!p.id||!p.nombre||!p.version||!Array.isArray(p.secciones)) throw new Error("Debe tener id, nombre, version y secciones");
  if(!["nucleo","modulo"].includes(p.tipo)) throw new Error("tipo debe ser 'nucleo' o 'modulo'"); p.palabras=p.palabras||[]; const cods=new Set();
  p.secciones.forEach(s=>{ if(!s.titulo||!Array.isArray(s.preguntas)) throw new Error("Cada sección necesita titulo y preguntas"); s.preguntas.forEach(x=>{ if(!x.cod||!x.texto) throw new Error("Cada pregunta necesita cod y texto"); if(cods.has(x.cod)) throw new Error("Código repetido: "+x.cod); cods.add(x.cod); x.tipo="sino"; x.peso=Math.max(1,Math.min(3,Number(x.peso)||1)); x.critica=!!x.critica; }); }); }
async function cargarPlantillas(){ PLANT_CACHE=(await DB.all("plantillas")).sort((a,b)=>(a.tipo==="nucleo"?-1:1)-(b.tipo==="nucleo"?-1:1)||a.id.localeCompare(b.id)); }

async function exportar(conFotos){ const [ps,vs,fs,pl,bi]=await Promise.all([DB.all("proyectos"),DB.all("visitas"),conFotos?DB.all("fotos"):[],DB.all("plantillas"),DB.all("bitacora")]);
  const paq={app:APP.nombre,version:APP.version,esquema:APP.esquema,exportado:isoLima(),usuario:CFG.usuario,dispositivo:CFG.dispositivo,proyectos:ps,visitas:vs,fotos:fs,plantillas:pl,bitacora:bi};
  paq.huella=await sha256(canon({proyectos:ps.map(x=>x.uuid+x.fecha_modificacion),visitas:vs.map(x=>x.uuid+x.fecha_modificacion+(x.hash||""))}));
  descargar(`SUPERVISA_${(CFG.usuario||"usuario").replace(/\W+/g,"_")}_${stamp()}${conFotos?"":"_sin_fotos"}.json`,JSON.stringify(paq));
  for(const p of ps){ if(!p.exportado){ p.exportado=true; await DB.put("proyectos",p);} } for(const v of vs){ if(!v.exportado){ v.exportado=true; await DB.put("visitas",v);} }
  await log("EXPORTAR","paquete","",`${ps.length} proy, ${vs.length} vis, ${fs.length} fotos`); toast("Paquete exportado ✔"); }
async function importar(paq){ if(!paq||paq.app!==APP.nombre) throw new Error("No es un paquete de "+APP.nombre); const r={n:0,a:0,c:0};
  const merge=async(store,lista,clave)=>{ for(const inc of (lista||[])){ const loc=await DB.get(store,inc[clave]);
     if(!loc){ await DB.put(store,inc); r.n++; continue; }
     if(store==="visitas"&&loc.estado==="CERRADA"&&inc.hash!==loc.hash){ r.c++; await log("CONFLICTO","visita",inc.uuid,"se conserva la versión local cerrada"); continue; }
     if((inc.fecha_modificacion||"")>(loc.fecha_modificacion||"")){ await DB.put(store,inc); r.a++; } } };
  await merge("proyectos",paq.proyectos,"uuid"); await merge("visitas",paq.visitas,"uuid"); await merge("fotos",paq.fotos,"uuid");
  for(const b of (paq.bitacora||[])) if(!(await DB.get("bitacora",b.id))) await DB.put("bitacora",b);
  for(const p of (paq.plantillas||[])){ const loc=await DB.get("plantillas",p.id); if(!loc||String(p.version)>String(loc.version)) await DB.put("plantillas",p); }
  await log("IMPORTAR","paquete","",`de ${paq.usuario||"?"} (${paq.dispositivo||"?"}) exportado ${fmtFecha(paq.exportado)}: ${r.n} nuevos, ${r.a} act., ${r.c} conflictos`); return r; }
function csvCampo(x){ const s=String(x??""); return /[;"\n\r]/.test(s)?`"${s.replace(/"/g,'""')}"`:s; }
function csvDescargar(nombre,filas){ descargar(nombre,"\uFEFF"+filas.map(f=>f.map(csvCampo).join(";")).join("\r\n"),"text/csv;charset=utf-8"); }
async function csvRespuestas(){ const [ps,vs,fs]=await Promise.all([DB.all("proyectos"),DB.all("visitas"),DB.all("fotos")]); const filas=[["CUI","Proyecto","Visita_N","Fecha","Supervisor","Estado_visita","Seccion","Codigo","Pregunta","Peso","Critica","Respuesta","Observacion","N_fotos","Latitud","Longitud"]];
  for(const v of vs.filter(v=>v.estado_registro!=="BAJA")){ const p=ps.find(x=>x.uuid===v.proyecto_uuid)||{}; for(const x of preguntasDe(v.plantillas)){ const r=v.respuestas[x.cod]||{}; filas.push([p.cui,p.nombre,v.numero,fmtFecha(v.fecha_creacion),v.supervisor,v.estado,x.seccion,x.cod,x.texto,x.peso,x.critica?"SI":"NO",{SI:"Sí",NO:"No",NA:"N.A."}[r.v]||"",r.obs||"",fs.filter(f=>f.visita_uuid===v.uuid&&f.pregunta===x.cod).length,c6(v.lat),c6(v.lon)]); } }
  csvDescargar(`SUPERVISA_respuestas_${stamp()}.csv`,filas); }
async function csvResumen(){ const [ps,vs]=await Promise.all([DB.all("proyectos"),DB.all("visitas")]); const filas=[["CUI","Proyecto","Entidad","Sector","Departamento","Provincia","Distrito","Visita_N","Fecha","Supervisor","Estado","Puntaje_%","Semaforo","Criticos","Avance_fisico_%","Avance_programado_%","Brecha_avance_pp","Latitud","Longitud","Huella"]];

  csvDescargar(`SUPERVISA_resumen_visitas_${stamp()}.csv`,filas); }

async function bajarTodo(tabla,desde){ let out=[],off=0; while(true){ const r=await authFetch(`/rest/v1/${tabla}?select=*&order=servidor_actualizado.asc&limit=1000&offset=${off}${desde?`&servidor_actualizado=gt.${encodeURIComponent(desde)}`:""}`); if(!r.ok) throw new Error(`Bajada ${tabla}: `+await errTxt(r)); const a=await r.json(); out=out.concat(a); if(a.length<1000) return out; off+=1000; } }
async function sincronizar(manual=false){
  if(SYNC_ACTIVO) return; if(!sesion()){ if(manual) ir("cuenta"); return; }
  if(!navigator.onLine){ if(manual) toast("Sin internet: se sincronizará cuando vuelva la señal"); return; }
  SYNC_ACTIVO=true; pintarSync(); const res={sub:0,baj:0,err:[]};
  try{
    const perfil=await cargarPerfil(); if(!perfil||!perfil.activo) throw new Error("Su cuenta aún no fue activada por el gerente");
    const uid=sesion().uid;
    for(const p of (await DB.all("proyectos")).filter(x=>!x.sincronizado)){ const e=await subir("/rest/v1/proyectos?on_conflict=uuid",proyAServidor(p)); if(e) res.err.push(`Proyecto ${p.cui||p.nombre}: ${e}`); else { p.sincronizado=true; await DB.put("proyectos",p); res.sub++; } }
    for(const v of (await DB.all("visitas")).filter(x=>!x.sincronizado)){ const e=await subir("/rest/v1/visitas?on_conflict=uuid",visAServidor(v)); if(e) res.err.push(`Visita ${v.cui||""} N.° ${v.numero}: ${e}`); else { v.sincronizado=true; await DB.put("visitas",v); res.sub++; } }
    await subirOT(res);
    for(const f of (await DB.all("fotos")).filter(x=>!x.subida)){
      const ruta=`${uid}/${f.visita_uuid||f.parte_uuid||f.incidencia_uuid}/${f.uuid}.jpg`; const blob=await (await fetch(f.data)).blob();
      const r=await authFetch(`/storage/v1/object/fotos/${ruta}`,{method:"POST",headers:{"Content-Type":"image/jpeg","x-upsert":"false"},body:blob});
      if(!r.ok){ const t2=await errTxt(r); if(!/exist|duplicate/i.test(t2)){ res.err.push("Foto: "+t2); continue; } }
      const e=await subir("/rest/v1/fotos?on_conflict=uuid",{uuid:f.uuid,visita_uuid:f.visita_uuid||null,parte_uuid:f.parte_uuid||null,incidencia_uuid:f.incidencia_uuid||null,pregunta:f.pregunta||null,storage_path:ruta,fecha:tz(f.fecha),lat:nz(f.lat),lon:nz(f.lon),hash:f.hash||null,creado_por:f.creado_por||null,dispositivo:f.dispositivo||null},"resolution=ignore-duplicates,return=minimal");
      if(e) res.err.push("Foto: "+e); else { f.subida=true; f.storage_path=ruta; await DB.put("fotos",f); res.sub++; } }
    const bit=(await DB.all("bitacora")).filter(b=>!b.subida);
    if(bit.length){ const e=await subir("/rest/v1/bitacora?on_conflict=id",bit.map(b=>({id:b.id,ts:b.ts,usuario:b.usuario||null,dispositivo:b.dispositivo||null,accion:b.accion,entidad:b.entidad||null,ref:b.ref||null,detalle:b.detalle||null})),"resolution=ignore-duplicates,return=minimal");
      if(e) res.err.push("Bitácora: "+e); else for(const b of bit){ b.subida=true; await DB.put("bitacora",b); } }
    if(perfil.rol==="gerente"){ for(const p of PLANT_CACHE.filter(x=>x.importada&&!x.subida)){ const e=await subir("/rest/v1/plantillas?on_conflict=id",{id:p.id,version:String(p.version),tipo:p.tipo,contenido:p}); if(e) res.err.push("Plantilla "+p.id+": "+e); else { p.subida=true; await DB.put("plantillas",p); } } }
    let maxTs=CFG.ultima_bajada||"";
    for(const [tabla,conv] of [["proyectos",servAProy],["visitas",servAVis]]){
      for(const s of await bajarTodo(tabla,CFG.ultima_bajada)){ if(!maxTs||s.servidor_actualizado>maxTs) maxTs=s.servidor_actualizado;
        const loc=await DB.get(tabla,s.uuid); const inc=conv(s);
        if(loc){ if(!loc.sincronizado&&cmpF(loc.fecha_modificacion,inc.fecha_modificacion)>0) continue;
          const reabre=tabla==="visitas"&&loc.estado==="CERRADA"&&inc.estado!=="CERRADA"&&(inc.reabierta||[]).length>(loc.reabierta||[]).length;
          if(tabla==="visitas"&&loc.estado==="CERRADA"&&inc.estado!=="CERRADA"&&!reabre) continue;
          if(!reabre&&cmpF(inc.fecha_modificacion,loc.fecha_modificacion)<=0&&loc.sincronizado) continue; }
        await DB.put(tabla,inc); res.baj++; } }
    await bajarOT(res);
    const rp=await authFetch("/rest/v1/plantillas?select=*"); if(rp.ok){ for(const s of await rp.json()){ const loc=PLANT_CACHE.find(x=>x.id===s.id); if(!loc||String(s.version)>String(loc.version)){ await DB.put("plantillas",{...s.contenido,subida:true,importada:s.fecha}); res.baj++; } } await cargarPlantillas(); }
    await cfgSet("ultima_bajada",maxTs); await cfgSet("ultima_sync",isoLima());
    if(res.sub||res.baj) await log("SINCRONIZAR","central","",`${res.sub} subidos, ${res.baj} recibidos`);
  }catch(e){ res.err.push(e.message); }
  SYNC_ACTIVO=false; await cfgSet("ultimo_error_sync",res.err.slice(0,5).join(" | ")); await pintarSync();
  if(manual||res.err.length) toast(res.err.length?("⚠ "+res.err[0]):`Sincronizado ✔ ${res.sub} subidos · ${res.baj} recibidos`,4500);
  if(res.baj&&["proyectos","proyecto","ordenes","orden"].includes(VISTA)) render();
  return res; }

function avancePlan(o){ if(!o.fecha_inicio_plan||!o.fecha_fin_plan) return null; const i=Date.parse(o.fecha_inicio_plan+"T00:00:00Z"), f=Date.parse(o.fecha_fin_plan+"T00:00:00Z"), h=Date.parse(hoyLima()+"T00:00:00Z"); if(!(f>i)) return null; return Math.max(0,Math.min(100,Math.round((h-i)*1000/(f-i))/10)); }
function alertaOT(o,incAb){ const pl=avancePlan(o), real=Number(o.avance_real||0), d=pl==null?null:Math.round((real-pl)*10)/10;
  const sinRep=o.estado==="EN_CURSO"&&(!o.ultimo_parte||o.ultimo_parte<hoyLima()); let nivel="s-ok",txt="Al día";
  if(["TERMINADA","ENTREGADA"].includes(o.estado)){ nivel="s-ok"; txt=EST_OT_TXT[o.estado]; }
  else if((d!=null&&d<-10)||(o.fecha_fin_plan&&o.fecha_fin_plan<hoyLima())){ nivel="s-bad"; txt="Atrasada"; }
  else if((d!=null&&d<-3)||incAb>0||sinRep){ nivel="s-warn"; txt=sinRep?"Sin parte hoy":incAb?"Con incidencias":"Leve atraso"; }
  return {pl,d,real,nivel,txt,sinRep}; }
function barraAvance(real,plan){ return `<div class="bar" style="position:relative;height:16px" title="Real ${Math.round(real)} % · Plan ${plan==null?"—":plan+" %"}"><i style="width:${Math.max(0,Math.min(100,real))}%;background:var(--ok)"></i>${plan!=null?`<span style="position:absolute;top:-4px;bottom:-4px;left:${plan}%;border-left:3px solid var(--text)"></span>`:""}</div>

/* ---------- sincronización de órdenes ---------- */
async function subirOT(res){
  const patch=async(tabla,u,body)=>{ const r=await authFetch(`/rest/v1/${tabla}?uuid=eq.${u}`,{method:"PATCH",headers:{"Content-Type":"application/json",Prefer:"return=minimal"},body:JSON.stringify(body)}); return r.ok?null:await errTxt(r); };
  for(const o of (await DB.all("ordenes")).filter(x=>x.sincronizado===false)){ const e=await patch("ordenes",o.uuid,{estado:o.estado,modificado_por:o.modificado_por||CFG.usuario,fecha_modificacion:tz(o.fecha_modificacion)}); if(e) res.err.push(`Orden ${o.codigo}: ${e}`); else { o.sincronizado=true; await DB.put("ordenes",o); res.sub++; } }
  for(const t of (await DB.all("tareas")).filter(x=>x.sincronizado===false)){ const e=await patch("tareas",t.uuid,{estado:t.estado,avance:t.avance,modificado_por:t.modificado_por||CFG.usuario,fecha_modificacion:tz(t.fecha_modificacion)}); if(e) res.err.push(`Tarea: ${e}`); else { t.sincronizado=true; await DB.put("tareas",t); res.sub++; } }
  for(const p of (await DB.all("partes")).filter(x=>!x.sincronizado)){ const e=await subir("/rest/v1/partes_diarios?on_conflict=uuid",{uuid:p.uuid,orden_uuid:p.orden_uuid,fecha:p.fecha,autor:p.autor||null,avance_acumulado:nz(p.avance_acumulado),actividades:p.actividades||null,personal:nz(p.personal),horas:nz(p.horas),materiales:p.materiales||null,clima:p.clima||null,observaciones:p.observaciones||null,lat:nz(p.lat),lon:nz(p.lon),precision_m:nz(p.precision_m),creado_por:p.creado_por||null,fecha_creacion:tz(p.fecha_creacion),modificado_por:p.modificado_por||null,fecha_modificacion:tz(p.fecha_modificacion),dispositivo:p.dispositivo||null});
    if(e) res.err.push(`Parte ${fmtD(p.fecha)}: ${e}`); else { p.sincronizado=true; await DB.put("partes",p); res.sub++; } }
  for(const i of (await DB.all("incidencias")).filter(x=>!x.sincronizado)){ const e=await subir("/rest/v1/incidencias?on_conflict=uuid",{uuid:i.uuid,orden_uuid:i.orden_uuid,tipo:i.tipo,gravedad:i.gravedad,descripcion:i.descripcion,estado:i.estado,respuesta:i.respuesta||null,autor:i.autor||null,fecha:tz(i.fecha),lat:nz(i.lat),lon:nz(i.lon),cerrado_por:i.cerrado_por||null,fecha_cierre:tz(i.fecha_cierre),fecha_modificacion:tz(i.fecha_modificacion),dispositivo:i.dispositivo||null});
    if(e) res.err.push(`Incidencia: ${e}`); else { i.sincronizado=true; await DB.put("incidencias",i); res.sub++; } } }
async function bajarOT(res){
  try{ const desde=CFG.ultima_bajada_ot||""; let maxTs=desde;
    for(const [tabla,store] of [["ordenes","ordenes"],["tareas","tareas"],["partes_diarios","partes"],["incidencias","incidencias"]]){
      for(const s of await bajarTodo(tabla,desde)){ if(!maxTs||s.servidor_actualizado>maxTs) maxTs=s.servidor_actualizado;
        const loc=await DB.get(store,s.uuid); if(loc&&loc.sincronizado===false&&cmpF(loc.fecha_modificacion,s.fecha_modificacion)>0) continue;
        const inc={...s,sincronizado:true}; if(store!=="tareas"){ inc.lat=s.lat==null?"":Number(s.lat); inc.lon=s.lon==null?"":Number(s.lon); }
        await DB.put(store,inc); res.baj++; } }
    const r=await authFetch("/rest/v1/equipos?select=id,nombre,region,lider_id"); if(r.ok) for(const e of await r.json()) await DB.put("equipos",e);
    const rc=await authFetch("/rest/v1/capas_catalogo?select=id,nombre,entidad,id_geoperu,url,capa_nombre&activa=eq.true"); if(rc.ok) await cfgSet("capas",await rc.json());
    await cfgSet("ultima_bajada_ot",maxTs);
  }catch(e){ if(!/does not exist|Could not find|PGRST20|schema cache|404/i.test(e.message)) res.err.push(e.message); } }

  const persistente=await DB.open(); await cfgGet();
  if(!CFG.dispositivo) await cfgSet("dispositivo","EQ-"+uuid().slice(0,8).toUpperCase());
  const pls=await DB.all("plantillas"); for(const b of PLANTILLAS_BASE){ const l=pls.find(x=>x.id===b.id); if(!l||String(b.version)>String(l.version)) await DB.put("plantillas",b); }
  await cargarPlantillas(); aplicarApariencia(); netEstado();
  if(navigator.storage&&navigator.storage.persist) navigator.storage.persist().catch(()=>{});
  if(!persistente) toast("Atención: este navegador no permite guardar datos. Exporte antes de cerrar.",6000);
  ir("proyectos"); if(!CFG.usuario) setTimeout(dlgUsuario,300);
  instalarPWA(); iniciarCentral(); iniciarOT();
})();
</script>
